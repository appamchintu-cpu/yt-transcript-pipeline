name: Temporary YouTube Audio Access Test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "yt-dlp[default]"
      - name: Test YouTube audio download (no transcription/API)
        run: |
          yt-dlp --no-warnings --format "bestaudio[filesize<20M]/bestaudio" --output "/tmp/audio-test.%(ext)s" https://www.youtube.com/watch?v=aqz-KE-bpKQ
          python -c "from pathlib import Path; files=list(Path('/tmp').glob('audio-test.*')); assert files and files[0].stat().st_size > 0; print('Downloaded bytes:', files[0].stat().st_size)"
  