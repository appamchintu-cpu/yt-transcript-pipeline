name: Temporary YouTube Audio Access Test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "yt-dlp[default]"
      - name: Test YouTube audio download (no transcription/API)
        run: |
          set -o pipefail
          yt-dlp --no-warnings --format "bestaudio[filesize<20M]/bestaudio" --output /tmp/audio-test.%(ext)s --print "after_move:filepath" https://www.youtube.com/watch?v=aqz-KE-bpKQ
          test -s /tmp/audio-test.*
          ls -lh /tmp/audio-test.*
